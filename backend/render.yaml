# Reference Blueprint; this does not describe the verified live deployment.
# Select backend/render.yaml as the Blueprint path when importing this repository.
services:
  - type: web
    name: ielts-backend
    runtime: python
    rootDir: backend
    buildCommand: python -m pip install --upgrade pip==26.2.1 && python -m pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.12
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PARSER_PROFILE
        value: doubao
      - key: MAX_PARSE_PAGES
        value: "10"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DOUBAO_API_KEY
        sync: false
      - key: DOUBAO_ENDPOINT
        sync: false
